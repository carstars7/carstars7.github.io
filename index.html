---
layout: default
title: صفحه اصلی
---
<style>
    .page-title {
        margin-bottom: 30px;
        font-size: 28px;
        border-bottom: 2px solid #f0f0f0;
        padding-bottom: 10px;
    }
    .post-card {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 20px;
        transition: transform 0.2s, box-shadow 0.2s;
        border-right: 4px solid #fff;
    }
    .post-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        border-right-color: #0056b3; /* خط رنگی کنار کارت هنگام هاور */
    }
    .post-card h2 {
        margin: 0 0 10px 0;
        font-size: 22px;
    }
    .post-card h2 a {
        color: #222;
    }
    .post-card h2 a:hover {
        color: #0056b3;
    }
    .post-date {
        font-size: 13px;
        color: #888;
    }
</style>

<h1 class="page-title">آخرین مقالات</h1>

<div class="post-list">
  {% for post in site.posts %}
    <div class="post-card">
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <div class="post-date">📅 تاریخ انتشار: {{ post.date | date: "%Y-%m-%d" }}</div>
    </div>
  {% endfor %}
</div>

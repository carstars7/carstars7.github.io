    <style>
        :root { --primary: #f97316; --secondary: #eab308; --bg-color: #f0f2f5; --card-bg: #ffffff; --text-main: #333333; }
        body { font-family: 'Vazirmatn', sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.8; margin: 0; padding: 0; }
        header { background: linear-gradient(to right, #ffffff, #fffcf5); border-bottom: 3px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 12px 0; position: sticky; top: 0; z-index: 1000; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .site-title { text-decoration: none; color: #222; font-weight: 800; font-size: 24px; display: flex; align-items: center; gap: 12px; }
        .site-title img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--secondary); box-shadow: 0 2px 8px rgba(249, 115, 22, 0.2); }
        .site-title span { color: var(--primary); }
        nav a { color: #555; text-decoration: none; margin-right: 20px; font-weight: 600; transition: color 0.3s; }
        nav a:hover { color: var(--primary); }
        .wrapper { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 3fr 1fr; gap: 30px; }
        .card { background: var(--card-bg); border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); padding: 30px; margin-bottom: 30px; border: 1px solid #eaeaea; }
        .sidebar .card { padding: 25px 20px; }
        .sidebar-title { font-size: 18px; font-weight: bold; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 20px; color: #222; }
        .sidebar-title i { color: var(--primary); margin-left: 8px; }
        
        .author-box { text-align: center; }
        .author-box img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--secondary); padding: 3px; margin-bottom: 15px;}
        .author-box h3 { margin: 0 0 5px 0; font-size: 18px; }
        .author-box p { font-size: 14px; color: #777; margin-bottom: 20px; line-height: 1.7;}
        
        /* استایل شبکه‌های اجتماعی */
        .social-links { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .social-links a { 
            display: flex; align-items: center; justify-content: center; 
            width: 40px; height: 40px; 
            background: #fff5eb; color: var(--primary); 
            border-radius: 50%; text-decoration: none; 
            transition: all 0.3s; font-size: 20px; /* سایز آیکون‌ها استانداردتر شد */
        }
        .social-links a:hover { background: var(--primary); color: white; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3); }
        
        /* کلاس نقاب‌گذاری آیکون‌ها */
        .icon-mask { 
            display: inline-block; width: 1em; height: 1em; background-color: currentColor; 
            -webkit-mask-size: contain; mask-size: contain; 
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; 
            -webkit-mask-position: center; mask-position: center; 
        }

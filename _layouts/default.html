<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "سایت آموزش هوش مصنوعی من" }}</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f7f7f7; color: #333; line-height: 1.9; margin: 0; padding: 0; }
        header { background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 20px; text-align: center; }
        header a { text-decoration: none; color: #222; font-weight: 700; font-size: 24px; }
        .container { max-width: 800px; margin: 40px auto; background: #fff; padding: 40px 50px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; }
        h1 { font-size: 32px; color: #111; margin-bottom: 10px; line-height: 1.4; }
        .meta { color: #777; font-size: 14px; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .content { font-size: 18px; }
        .post-list { list-style: none; padding: 0; }
        .post-list li { margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 20px; }
        .post-list a { text-decoration: none; color: #0056b3; font-size: 22px; font-weight: bold; }
        .post-list a:hover { color: #cc0000; }
        .post-date { display: block; color: #999; font-size: 14px; margin-top: 5px; }
        @media (max-width: 768px) { .container { margin: 15px; padding: 20px; } h1 { font-size: 24px; } .content { font-size: 16px; } }
    </style>
</head>
<body>
    <header>
        <a href="/">آموزش هوش مصنوعی</a>
    </header>
    <div class="container">
        {{ content }}
    </div>
</body>
</html>

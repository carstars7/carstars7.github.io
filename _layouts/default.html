<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="PYXn9t45sanThb2aLx0SCVAMLN1GLoAuCIVJXpo0bOA" />
    
    <title>{{ page.title | default: "کاراستارز | آموزش هوش مصنوعی" }}</title>
    
    <link rel="icon" type="image/jpeg" href="/logo.jpg">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="text/javascript">
        (function (){
          const head = document.getElementsByTagName("head")[0];
          const script = document.createElement("script");
          script.type = "text/javascript";
          script.async = true;
          script.src = "https://s1.mediaad.org/serve/carstars7.github.io/loader.js";
          head.appendChild(script);
        })();
    </script>
    
    <style>
        :root { --primary: #f97316; --secondary: #eab308; --bg-color: #f0f2f5; --card-bg: #ffffff; --text-main: #333333; }
        body { font-family: 'Vazirmatn', sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.8; margin: 0; padding: 0; }
        header { background: linear-gradient(to right, #ffffff, #fffcf5); border-bottom: 3px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 12px 0; position: sticky; top: 0; z-index: 1000; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .site-title { text-decoration: none; color: #222; font-weight: 800; font-size: 24px; display: flex; align-items: center; gap: 12px; }
        .site-title img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--secondary); box-shadow: 0 2px 8px rgba(249, 115, 22, 0.2); }
        .site-title span { color: var(--primary); }
        nav a { color: #555; text-decoration: none; margin-right: 20px; font-weight: 600; transition: color 0.3s; }
        nav a:hover { color: var(--primary); }
        .wrapper { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 3fr 1fr; gap: 30px; }
        .card { background: var(--card-bg); border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); padding: 30px; margin-bottom: 30px; border: 1px solid #eaeaea; }
        .sidebar .card { padding: 25px 20px; }
        .sidebar-title { font-size: 18px; font-weight: bold; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 20px; color: #222; }
        .sidebar-title i { color: var(--primary); margin-left: 8px; }
        .author-box { text-align: center; }
        .author-box img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--secondary); padding: 3px; margin-bottom: 15px;}
        .author-box h3 { margin: 0 0 5px 0; font-size: 18px; }
        .author-box p { font-size: 14px; color: #777; margin-bottom: 15px; line-height: 1.7;}
        .social-links { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .social-links a { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: #fff5eb; color: var(--primary); border-radius: 50%; text-decoration: none; transition: all 0.3s; }
        .social-links a:hover { background: var(--primary); color: white; transform: translateY(-3px); }
        .main-content h1 { font-size: 30px; color: #111; margin-top: 0;}
        .main-content p { font-size: 17px; text-align: justify; }
        .main-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 20px 0; }
        footer { text-align: center; padding: 30px 20px; background: #fff; color: #888; border-top: 1px solid #eaeaea; font-size: 14px; }
        @media (max-width: 900px) { .wrapper { grid-template-columns: 1fr; } .header-inner { flex-direction: column; gap: 15px; } nav { margin-top: 10px; } nav a { margin: 0 10px; } }
        
        /* استایل‌های باکس جستجو */
        .search-input { width: 100%; padding: 12px 15px; border: 1px solid #eaeaea; border-radius: 8px; font-family: 'Vazirmatn', sans-serif; font-size: 14px; box-sizing: border-box; background: #f9f9f9; transition: border 0.3s; }
        .search-input:focus { outline: none; border-color: var(--primary); background: #fff; }
        #results-container { list-style: none; padding: 0; margin-top: 10px; font-size: 14px; }
        #results-container li { margin-bottom: 10px; border-bottom: 1px dashed #eee; padding-bottom: 10px; }
        #results-container li a { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="site-title"><img src="/logo.jpg" alt="لوگو کاراستارز"> کاراستارز | <span>هوش مصنوعی</span></a>
            <nav><a href="/"><i class="fa-solid fa-home"></i> خانه</a></nav>
        </div>
    </header>
    
    <div class="wrapper">
        <main class="main-content">
            {{ content }}
        </main>

        <aside class="sidebar">
            <div class="card author-box">
                <img src="/logo.jpg" alt="محمد صدرا">
                <h3>محمد صدرا</h3>
                <p>با آموزش‌های ساده، به‌روز و کاربردی، مهارت‌های دیجیتال و هوش مصنوعی رو یاد بگیر و در دنیای تکنولوژی حرفه‌ای شو!</p>
                <div class="social-links">
                    <a href="https://aparat.com/car_stars_7"><i class="fa-solid fa-video"></i></a>
                    <a href="https://youtube.com/@car_stars_7"><i class="fa-brands fa-youtube"></i></a>
                    <a href="https://t.me/car_stars_7"><i class="fa-brands fa-telegram"></i></a>
                </div>
            </div>

            <!-- باکس جدید جستجو که جایگزین برچسب‌ها شد -->
            <div class="card">
                <div class="sidebar-title"><i class="fa-solid fa-magnifying-glass"></i> جستجو در سایت</div>
                <div>
                    <input type="text" id="search-input" class="search-input" placeholder="دنبال چه آموزشی هستی؟...">
                    <ul id="results-container"></ul>
                </div>
            </div>
            
            <div class="card">
                <div id="mediaad-EgB0j"></div>
            </div>
        </aside>
    </div>
    
    <footer>
        <i class="fa-solid fa-heart" style="color: var(--primary);"></i> ساخته شده با افتخار برای کاراستارز بر بستر گیت‌هاب
    </footer>

    <div id="mediaad-RlBM7"></div>

    <!-- اسکریپت موتور جستجوی سریع سایت -->
    <script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
    <script>
        var sjs = SimpleJekyllSearch({
            searchInput: document.getElementById('search-input'),
            resultsContainer: document.getElementById('results-container'),
            json: '/search.json',
            searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
            noResultsText: '<li style="color: #777; font-size: 13px;">مقاله‌ای با این نام پیدا نشد!</li>'
        })
    </script>
</body>
</html>
